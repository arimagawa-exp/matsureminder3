    <script>
        // --- IndexedDB Configuration for Persistent Offline Storage ---
        const DB_NAME = 'MatsuReminderDB';
        const DB_VERSION = 1;
        const STORE_NAME = 'app_data';

        function openDatabase() {
            return new Promise((resolve, reject) => {
                if (!window.indexedDB) {
                    resolve(null);
                    return;
                }
                const request = indexedDB.open(DB_NAME, DB_VERSION);
                request.onupgradeneeded = function(e) {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains(STORE_NAME)) {
                        db.createObjectStore(STORE_NAME);
                    }
                };
                request.onsuccess = function(e) {
                    resolve(e.target.result);
                };
                request.onerror = function(e) {
                    console.error('IndexedDB open error:', e);
                    resolve(null);
                };
            });
        }

        async function saveToIndexedDB(key, val) {
            const db = await openDatabase();
            if (!db) return;
            return new Promise((resolve) => {
                const tx = db.transaction(STORE_NAME, 'readwrite');
                const store = tx.objectStore(STORE_NAME);
                store.put(val, key);
                tx.oncomplete = () => resolve();
                tx.onerror = () => resolve();
            });
        }

        async function getFromIndexedDB(key) {
            const db = await openDatabase();
            if (!db) return null;
            return new Promise((resolve) => {
                const tx = db.transaction(STORE_NAME, 'readonly');
                const store = tx.objectStore(STORE_NAME);
                const req = store.get(key);
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => resolve(null);
            });
        }

        // Color preset mapping
        const COLOR_PRESETS = {
            sky: { color: 'bg-sky-500/10 text-sky-400 border-sky-500/30', dot: 'bg-sky-400 ring-2 ring-sky-400/40 shadow-sm shadow-sky-500/50', name: 'ブルー' },
            rose: { color: 'bg-rose-500/10 text-rose-400 border-rose-500/30', dot: 'bg-rose-400 ring-2 ring-rose-400/40 shadow-sm shadow-rose-500/50', name: 'レッド' },
            emerald: { color: 'bg-emerald-500/10 text-emerald-400 border-emerald-500/30', dot: 'bg-emerald-400 ring-2 ring-emerald-400/40 shadow-sm shadow-emerald-500/50', name: 'グリーン' },
            purple: { color: 'bg-purple-500/10 text-purple-400 border-purple-500/30', dot: 'bg-purple-400 ring-2 ring-purple-400/40 shadow-sm shadow-purple-500/50', name: 'パープル' },
            amber: { color: 'bg-amber-500/10 text-amber-400 border-amber-500/30', dot: 'bg-amber-400 ring-2 ring-amber-400/40 shadow-sm shadow-amber-500/50', name: 'オレンジ' },
            pink: { color: 'bg-pink-500/10 text-pink-400 border-pink-500/30', dot: 'bg-pink-400 ring-2 ring-pink-400/40 shadow-sm shadow-pink-500/50', name: 'ピンク' },
            indigo: { color: 'bg-indigo-500/10 text-indigo-400 border-indigo-500/30', dot: 'bg-indigo-400 ring-2 ring-indigo-400/40 shadow-sm shadow-indigo-500/50', name: 'インディゴ' }
        };

        const DEFAULT_CATEGORIES = {
            assignment: { label: '課題・レポート', colorKey: 'sky' },
            exam: { label: '試験・テスト', colorKey: 'rose' },
            document: { label: '提出書類', colorKey: 'emerald' },
            other: { label: 'その他', colorKey: 'purple' }
        };

        const DEFAULT_NOTIFICATION_TEMPLATES = {
            '1w_21': '【1週間前】「{title}」の締め切り（{dueDate}）まであと1週間です！',
            '3d_21': '【3日前】「{title}」の締め切りが近づいています！進捗はいかがですか？',
            '1d_21': '【前日リマインド】明日「{title}」の締め切りです！提出忘れにご注意ください。',
            'same_08': '【本日締切！】「{title}」は本日が最終締め切りです！'
        };

        // --- Core Helper Functions ---
        function getFormattedDateStr(dateObj) {
            const y = dateObj.getFullYear();
            const m = String(dateObj.getMonth() + 1).padStart(2, '0');
            const d = String(dateObj.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function getDaysRemaining(dueDateStr) {
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const due = new Date(dueDateStr + 'T00:00:00');
            const diffTime = due - today;
            return Math.ceil(diffTime / (1000 * 60 * 60 * 24));
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            if (!toast || !toastMsg) return;
            toastMsg.innerText = msg;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 2500);
        }

        // State variables
        let tasks = JSON.parse(localStorage.getItem('smart_tasks_data')) || [];
        let customCategories = JSON.parse(localStorage.getItem('smart_tasks_categories')) || DEFAULT_CATEGORIES;
        let categoryNotifyTimings = JSON.parse(localStorage.getItem('smart_tasks_cat_notify_timings')) || {};
        let currentFilter = 'all';
        let activePage = 'tasks';
        let currentDate = new Date();
        let selectedCalendarDateStr = getFormattedDateStr(new Date());

        // Initialize & restore persistent storage from IndexedDB if localStorage cleared
        async function initStorageSync() {
            try {
                const idbTasks = await getFromIndexedDB('smart_tasks_data');
                const idbCategories = await getFromIndexedDB('smart_tasks_categories');
                const idbTimings = await getFromIndexedDB('smart_tasks_cat_notify_timings');

                if (idbTasks && tasks.length === 0) tasks = idbTasks;
                if (idbCategories) customCategories = idbCategories;
                if (idbTimings) categoryNotifyTimings = idbTimings;

                saveToStorage();
            } catch(e) {
                console.error("Sync error:", e);
            }
        }

        function saveToStorage() {
            localStorage.setItem('smart_tasks_data', JSON.stringify(tasks));
            localStorage.setItem('smart_tasks_categories', JSON.stringify(customCategories));
            localStorage.setItem('smart_tasks_cat_notify_timings', JSON.stringify(categoryNotifyTimings));

            // Sync to IndexedDB for browser-cache resilience
            saveToIndexedDB('smart_tasks_data', tasks);
            saveToIndexedDB('smart_tasks_categories', customCategories);
            saveToIndexedDB('smart_tasks_cat_notify_timings', categoryNotifyTimings);
        }

        function getCategoryDetails(catKey) {
            const cat = customCategories[catKey] || { label: '未分類', colorKey: 'purple' };
            const preset = COLOR_PRESETS[cat.colorKey] || COLOR_PRESETS.purple;
            return {
                label: cat.label,
                colorKey: cat.colorKey,
                color: preset.color,
                dot: preset.dot
            };
        }

        function setFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.className = 'filter-btn px-3 py-1 text-xs font-semibold rounded-full bg-slate-800 text-slate-300 hover:bg-slate-700 whitespace-nowrap';
            });

            if (filter === 'pending') document.getElementById('filterPending').className = 'filter-btn px-3 py-1 text-xs font-semibold rounded-full bg-accent text-slate-950 shadow-sm whitespace-nowrap';
            if (filter === 'completed') document.getElementById('filterCompleted').className = 'filter-btn px-3 py-1 text-xs font-semibold rounded-full bg-accent text-slate-950 shadow-sm whitespace-nowrap';

        // --- Render Task List ---
        function renderTasks() {
            const taskList = document.getElementById('taskList');
            const searchInput = document.getElementById('searchInput').value.toLowerCase();
            taskList.innerHTML = '';

            let filtered = tasks.filter(t => {
                if (currentFilter === 'pending' && t.completed) return false;
                if (currentFilter === 'completed' && !t.completed) return false;
                if (searchInput && !t.title.toLowerCase().includes(searchInput) && !(t.desc && t.desc.toLowerCase().includes(searchInput))) return false;
                return true;
            });

            filtered.sort((a, b) => {
                if (a.completed !== b.completed) return a.completed ? 1 : -1;
                return new Date(`${a.dueDate}T${a.dueTime}`) - new Date(`${b.dueDate}T${b.dueTime}`);
            });

            document.getElementById('taskCountText').innerText = `全 ${filtered.length} 件の課題`;

            const urgentCount = tasks.filter(t => !t.completed && getDaysRemaining(t.dueDate) <= 2).length;
            document.getElementById('urgentCountText').innerText = urgentCount > 0 ? `⚠️ 締め切り間近: ${urgentCount}件` : '';

            if (filtered.length === 0) {
                taskList.innerHTML = `
                    <div class="text-center py-12 text-slate-500">
                        <i class="fa-solid fa-clipboard-check text-4xl mb-3 text-slate-700"></i>
                        <p class="text-sm">該当する課題はありません</p>
                    </div>
                `;
                return;
            }

            filtered.forEach(task => {
                const daysLeft = getDaysRemaining(task.dueDate);
                const catDetails = getCategoryDetails(task.category);
                
                let badgeClass = 'bg-slate-800 text-slate-400';
                let badgeText = `${task.dueDate} ${task.dueTime}`;

                if (!task.completed) {
                    if (daysLeft < 0) {
                        badgeClass = 'bg-rose-500/20 text-rose-400 border border-rose-500/30';
                        badgeText = `期限超過 (${Math.abs(daysLeft)}年前)`;
                    } else if (daysLeft === 0) {
                        badgeClass = 'bg-amber-500/20 text-amber-400 border border-amber-500/30 font-bold';
                        badgeText = `今日締切 (${task.dueTime})`;
                    } else if (daysLeft === 1) {
                        badgeClass = 'bg-amber-500/10 text-amber-300 border border-amber-500/20';
                        badgeText = `明日締切 (${task.dueTime})`;
                    } else {
                        badgeText = `あと${daysLeft}日 (${task.dueDate})`;
                    }
                }

                const item = document.createElement('div');
                item.className = `bg-slate-900 border ${task.completed ? 'border-slate-800/60 opacity-60' : 'border-slate-800'} rounded-2xl p-4 shadow-md transition hover:border-slate-700 flex flex-col gap-2.5`;
                item.innerHTML = `
                    <div class="flex items-start justify-between gap-3">
                        <div class="flex items-start gap-3 flex-1 min-w-0">
                            <button onclick="toggleTaskComplete('${task.id}')" class="mt-0.5 text-xl transition text-slate-600 hover:text-accent">
                                <i class="fa-${task.completed ? 'solid fa-circle-check text-accent' : 'regular fa-circle'}"></i>
                            </button>
                            <div class="flex-1 min-w-0">
                                <div class="flex items-center gap-2 flex-wrap mb-1">
                                    <span class="px-2 py-0.5 text-[10px] font-bold rounded-md border ${catDetails.color}">
                                        ${catDetails.label}
                                    </span>
                                    <span class="text-[10px] px-2 py-0.5 rounded-full font-medium ${badgeClass}">
                                        ${badgeText}
                                    </span>
                                </div>
                                <h4 class="font-bold text-sm text-slate-100 ${task.completed ? 'line-through text-slate-500' : ''} truncate">${escapeHtml(task.title)}</h4>
                            </div>
                        </div>
                        <div class="flex items-center gap-1 shrink-0">
                            <button onclick="openModal('${task.id}')" class="p-1.5 text-slate-500 hover:text-slate-300 transition text-xs"><i class="fa-solid fa-pen"></i></button>
                            <button onclick="deleteTask('${task.id}')" class="p-1.5 text-slate-500 hover:text-rose-400 transition text-xs"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>
                    ${task.desc ? `<p class="text-xs text-slate-400 bg-slate-950/60 p-2.5 rounded-xl border border-slate-800/80 line-clamp-2 leading-relaxed ml-8">${escapeHtml(task.desc)}</p>` : ''}
                `;
                taskList.appendChild(item);
            });
        }

        // --- Render Calendar ---
        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            const monthNames = ["1月", "2月", "3月", "4月", "5月", "6月", "7月", "8月", "9月", "10月", "11月", "12月"];
            document.getElementById('calendarMonthYear').innerText = `${year}年 ${monthNames[month]}`;

            const firstDay = new Date(year, month, 1).getDay();
            const lastDate = new Date(year, month + 1, 0).getDate();

            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = '';

            for (let i = 0; i < firstDay; i++) {
                const blank = document.createElement('div');
                blank.className = 'aspect-square';
                grid.appendChild(blank);
            }

            const todayStr = getFormattedDateStr(new Date());

            for (let date = 1; date <= lastDate; date++) {
                const dateObj = new Date(year, month, date);
                const dateStr = getFormattedDateStr(dateObj);
                const dayTasks = tasks.filter(t => t.dueDate === dateStr);

                const cell = document.createElement('div');
                const isSelected = dateStr === selectedCalendarDateStr;
                const isToday = dateStr === todayStr;

                cell.onclick = () => selectCalendarDate(dateStr);
                cell.className = `aspect-square rounded-xl p-1 flex flex-col items-center justify-between cursor-pointer transition relative border ${
                    isSelected ? 'border-accent bg-accent/10 shadow-sm' : isToday ? 'border-slate-700 bg-slate-800/80' : 'border-transparent hover:bg-slate-800/50'
                }`;

                let dotsHtml = '';
                if (dayTasks.length > 0) {
                    dotsHtml = '<div class="flex items-center justify-center gap-0.5 mt-1 flex-wrap max-w-full px-0.5">';
                    const displayTasks = dayTasks.slice(0, 3);
                    displayTasks.forEach(t => {
                        const catDetails = getCategoryDetails(t.category);
                        dotsHtml += `<span class="w-2 h-2 rounded-full ${t.completed ? 'bg-slate-600' : catDetails.dot}"></span>`;
                    });
                    if (dayTasks.length > 3) {
                        dotsHtml += `<span class="text-[8px] text-slate-400 font-bold ml-0.5">+${dayTasks.length - 3}</span>`;
                    }
                    dotsHtml += '</div>';
                }

                cell.innerHTML = `
                    <span class="text-xs font-semibold ${isToday ? 'text-accent font-bold' : 'text-slate-300'}">${date}</span>
                    ${dotsHtml}
                `;
                grid.appendChild(cell);
            }

            renderCalendarSelectedTasks();
        }

        function selectCalendarDate(dateStr) {
            selectedCalendarDateStr = dateStr;
            renderCalendar();

        function loadCategoryNotifySettings() {
            const catKey = document.getElementById('notifyCategorySelect')?.value;
            if (!catKey) return;

            const timings = categoryNotifyTimings[catKey] || {};

            const getSetting = (key) => {
                const val = timings[key];
                if (typeof val === 'boolean') {
                    return { enabled: val, template: DEFAULT_NOTIFICATION_TEMPLATES[key] };
                } else if (val && typeof val === 'object') {
                    return {
                        enabled: val.enabled !== false,
                        template: val.template || DEFAULT_NOTIFICATION_TEMPLATES[key]
                    };
                }
                return { enabled: true, template: DEFAULT_NOTIFICATION_TEMPLATES[key] };
            };

            const s1w = getSetting('1w_21');
            document.getElementById('chk_1w_21').checked = s1w.enabled;
            document.getElementById('msg_1w_21').value = s1w.template;

            const s3d = getSetting('3d_21');
            document.getElementById('chk_3d_21').checked = s3d.enabled;
            document.getElementById('msg_3d_21').value = s3d.template;

            const s1d = getSetting('1d_21');
            document.getElementById('chk_1d_21').checked = s1d.enabled;
            document.getElementById('msg_1d_21').value = s1d.template;

            const sSame = getSetting('same_08');
            document.getElementById('chk_same_08').checked = sSame.enabled;
            document.getElementById('msg_same_08').value = sSame.template;
        }

        function saveCategoryNotifySettings() {
            const catKey = document.getElementById('notifyCategorySelect')?.value;
            if (!catKey) return;

            categoryNotifyTimings[catKey] = {
                '1w_21': {
                    enabled: document.getElementById('chk_1w_21').checked,
                    template: document.getElementById('msg_1w_21').value.trim() || DEFAULT_NOTIFICATION_TEMPLATES['1w_21']
                },
                '3d_21': {
                    enabled: document.getElementById('chk_3d_21').checked,
                    template: document.getElementById('msg_3d_21').value.trim() || DEFAULT_NOTIFICATION_TEMPLATES['3d_21']
                },
                '1d_21': {
                    enabled: document.getElementById('chk_1d_21').checked,
                    template: document.getElementById('msg_1d_21').value.trim() || DEFAULT_NOTIFICATION_TEMPLATES['1d_21']
                },
                'same_08': {
                    enabled: document.getElementById('chk_same_08').checked,
                    template: document.getElementById('msg_same_08').value.trim() || DEFAULT_NOTIFICATION_TEMPLATES['same_08']
                }
            };

            saveToStorage();
            const catName = customCategories[catKey]?.label || '選択したカテゴリ';
            showToast(`「${catName}」の通知設定を保存しました`);

        // --- Task Modal Handlers ---

            const modal = document.getElementById('taskModal');

            renderCategoryOptions();
            renderHourOptions();

            if (taskId) {
                const task = tasks.find(t => t.id === taskId);
                if (!task) return;

                document.getElementById('taskId').value = task.id;
                document.getElementById('taskTitle').value = task.title;
                document.getElementById('taskCategory').value = task.category || Object.keys(customCategories)[0];
                document.getElementById('taskDesc').value = task.desc || '';
                document.getElementById('taskDueDate').value = task.dueDate;

                const [h, m] = (task.dueTime || '23:00').split(':');
                document.getElementById('taskDueHour').value = h || '23';
                document.getElementById('taskDueMinute').value = m || '00';

                modalTitle.innerText = '課題を編集';
            } else {
                document.getElementById('taskForm').reset();
                document.getElementById('taskId').value = '';
                document.getElementById('taskDueDate').value = getFormattedDateStr(new Date());
                document.getElementById('taskDueHour').value = '23';
                document.getElementById('taskDueMinute').value = '00';
                modalTitle.innerText = '新しい課題を追加';
            }

            modal.classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('taskModal').classList.add('hidden');
        }

        function saveTask(event) {
            event.preventDefault();

            const id = document.getElementById('taskId').value;
            const title = document.getElementById('taskTitle').value.trim();
            const category = document.getElementById('taskCategory').value;
            const desc = document.getElementById('taskDesc').value.trim();
            const dueDate = document.getElementById('taskDueDate').value;
            const hour = document.getElementById('taskDueHour').value;
            const minute = document.getElementById('taskDueMinute').value;

            const dueTime = `${hour}:${minute}`;

            if (id) {
                const index = tasks.findIndex(t => t.id === id);
                if (index !== -1) {
                    tasks[index] = {
                        ...tasks[index],
                        title,
                        category,
                        desc,
                        dueDate,
                        dueTime
                    };
                }
            } else {
                const newTask = {
                    id: 'task_' + Date.now(),
                    title,
                    category,
                    desc,
                    dueDate,
                    dueTime,
                    completed: false,
                    notifiedFlags: {}
                };
                tasks.push(newTask);
            }

            saveToStorage();
            closeModal();
            renderTasks();
            renderCalendar();
            showToast(id ? '課題を更新しました' : '課題を追加しました');
        }

        function toggleTaskComplete(taskId) {
            const task = tasks.find(t => t.id === taskId);
            if (task) {
                task.completed = !task.completed;
                saveToStorage();
                renderTasks();
                renderCalendar();
                showToast(task.completed ? '課題を完了にしました！' : '課題を進行中に戻しました');
            }
        }

        function deleteTask(taskId) {
            tasks = tasks.filter(t => t.id !== taskId);
            saveToStorage();
            renderTasks();
            renderCalendar();
            showToast('課題を削除しました');
        }

        // --- Notification Handling ---
        function checkNotificationPermissionStatus() {
            const statusText = document.getElementById('notificationStatusText');
            if (!('Notification' in window)) {
                statusText.innerText = '非対応';
                return;
            }
            if (Notification.permission === 'granted') {
                statusText.innerText = '通知オン';
            } else if (Notification.permission === 'denied') {
                statusText.innerText = '通知ブロック';
            } else {
                statusText.innerText = '通知許可';
            }
        }

        function requestNotificationPermission() {
            if (!('Notification' in window)) {
                showToast('このブラウザは通知機能をサポートしていません');
                return;
            }
            Notification.requestPermission().then(permission => {
                checkNotificationPermissionStatus();
                if (permission === 'granted') {
                    showToast('通知が許可されました');
                } else {
                    showToast('通知許可が得られませんでした');
                }
            });
        }

        function checkAndSendNotifications() {
            if (!('Notification' in window) || Notification.permission !== 'granted') return;

            const now = new Date();
            const currentHour = now.getHours();

            tasks.forEach(task => {
                if (task.completed) return;
                if (!task.notifiedFlags) task.notifiedFlags = {};

                const daysLeft = getDaysRemaining(task.dueDate);
                const catKey = task.category;
                const timings = categoryNotifyTimings[catKey] || {};

                const getTimingConfig = (key) => {
                    const val = timings[key];
                    if (typeof val === 'boolean') {
                        return { enabled: val, template: DEFAULT_NOTIFICATION_TEMPLATES[key] };
                    } else if (val && typeof val === 'object') {
                        return { enabled: val.enabled !== false, template: val.template || DEFAULT_NOTIFICATION_TEMPLATES[key] };
                    }
                    return { enabled: true, template: DEFAULT_NOTIFICATION_TEMPLATES[key] };
                };

                const cfg1w = getTimingConfig('1w_21');
                const cfg3d = getTimingConfig('3d_21');
                const cfg1d = getTimingConfig('1d_21');
                const cfgSame = getTimingConfig('same_08');

                if (cfg1w.enabled && daysLeft === 7 && currentHour >= 21 && !task.notifiedFlags['1w_21']) {
                    sendNotification('1w_21', task, cfg1w.template);
                }
                if (cfg3d.enabled && daysLeft === 3 && currentHour >= 21 && !task.notifiedFlags['3d_21']) {
                    sendNotification('3d_21', task, cfg3d.template);
                }
                if (cfg1d.enabled && daysLeft === 1 && currentHour >= 21 && !task.notifiedFlags['1d_21']) {
                    sendNotification('1d_21', task, cfg1d.template);
                }
                if (cfgSame.enabled && daysLeft === 0 && currentHour >= 8 && !task.notifiedFlags['same_08']) {
                    sendNotification('same_08', task, cfgSame.template);
                }
            });

            saveToStorage();
        }

        function sendNotification(key, task, customTemplate = null) {
            let template = customTemplate || DEFAULT_NOTIFICATION_TEMPLATES[key];
            let bodyMsg = template.replace(/{title}/g, task.title).replace(/{dueDate}/g, task.dueDate);

            new Notification('MatsuReminder', {
                body: bodyMsg,
                icon: 'icon.png'
            });

            task.notifiedFlags[key] = true;
        }

        // --- Window Initializer ---
        window.onload = async function() {
            await initStorageSync();
            renderHourOptions();
            checkNotificationPermissionStatus();
            switchPage('tasks');
            checkAndSendNotifications();
            setInterval(checkAndSendNotifications, 60000);
        };
    </script>
</body>
</html>
